{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In - PIBA{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-5xl w-full bg-white rounded-3xl shadow-soft overflow-hidden">
        <div class="grid lg:grid-cols-2 min-h-[600px]">
            <!-- Form Column -->
            <div class="p-8 lg:p-12 flex flex-col justify-center">
            <!-- Header -->
            <div class="text-center mb-8">
                <img src="{% static 'images/logo/piba_logo_200x200.png' %}" alt="PIBA" class="w-16 h-16 mx-auto mb-4">
                <h1 class="text-2xl font-bold text-dark-800">Welcome Back!</h1>
                <p class="text-gray-600 mt-2">Sign in to your account</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-dark-700 mb-2">Email</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="email" name="email" required
                               class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition"
                               placeholder="Enter your email">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-dark-700 mb-2">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="password" name="password" required
                               class="w-full pl-12 pr-12 py-3 rounded-xl border border-gray-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition"
                               placeholder="Enter your password">
                        <button type="button" onclick="togglePassword(this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="rounded border-gray-300 text-primary-500 focus:ring-primary-500">
                        <span class="ml-2 text-sm text-gray-600">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-primary-600 hover:text-primary-700">Forgot password?</a>
                </div>

                <div id="login-error" class="hidden bg-red-50 text-red-600 p-3 rounded-xl text-sm"></div>

                <button type="submit" id="login-btn" class="w-full bg-primary-500 hover:bg-primary-600 text-white py-3 rounded-xl font-semibold transition btn-primary-glow flex items-center justify-center">
                    <span>Sign In</span>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-gray-500">New to PIBA?</span>
                </div>
            </div>

            <!-- Register Link -->
            <a href="{% url 'register' %}" class="block w-full text-center border-2 border-primary-500 text-primary-600 hover:bg-primary-50 py-3 rounded-xl font-semibold transition">
                Create an Account
            </a>

            <!-- Seller Link -->
                <p class="text-center text-sm text-gray-600 mt-4">
                    Want to sell pets? <a href="{% url 'seller_register' %}" class="text-primary-600 hover:text-primary-700 font-medium">Register as Seller</a>
                </p>
            </div>

            <!-- Image Column -->
            <div class="hidden lg:block relative bg-primary-50">
                <img src="{% static 'images/auth/service-cartoon.jpg' %}" alt="Join PIBA" 
                     class="absolute inset-0 w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-primary-600/20 to-transparent"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function togglePassword(btn) {
    const input = btn.parentElement.querySelector('input');
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
    } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
    }
    lucide.createIcons();
}

document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('login-btn');
    const errorDiv = document.getElementById('login-error');
    const formData = new FormData(this);
    
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';
    errorDiv.classList.add('hidden');
    
    try {
        const response = await fetch('/api/v1/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: formData.get('email'),
                password: formData.get('password')
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            // Store tokens
            AUTH.setTokens(data.tokens.access, data.tokens.refresh);
            
            showToast('Login successful!', 'success');
            
            // Role-based redirect
            const next = new URLSearchParams(window.location.search).get('next');
            const role = data.user?.role;
            const isSuperuser = data.user?.is_superuser;

            setTimeout(() => {
                if (next) {
                    window.location.href = next;
                } else if (role === 'admin' || isSuperuser) {
                    window.location.href = '/admin-panel/';
                } else if (role === 'seller') {
                    window.location.href = '/seller/dashboard/';
                } else {
                    window.location.href = '/profile/';
                }
            }, 500);
        } else {
            errorDiv.textContent = data.error || data.detail || 'Invalid email or password';
            errorDiv.classList.remove('hidden');
        }
    } catch {
        errorDiv.textContent = 'An error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In</span>';
    }
});
</script>
{% endblock %}
