{% extends 'base.html' %}
{% load static %}

{% block title %}Browse Pets - PIBA{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="mb-8">
        <h1 id="page-title" class="text-3xl font-bold text-dark-800 mb-2">All Pets</h1>
        <p class="text-gray-600">Find your perfect companion from our selection</p>
    </div>

    <div class="flex flex-col lg:flex-row gap-8">
        <!-- Filters Sidebar -->
        <aside class="lg:w-64 flex-shrink-0">
            <div class="bg-white rounded-2xl shadow-soft p-6 sticky top-24">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="font-semibold text-dark-800">Filters</h3>
                    <button onclick="clearFilters()" class="text-sm text-primary-600 hover:text-primary-700">Clear All</button>
                </div>

                <form id="filter-form" class="space-y-6">
                    <!-- Category -->
                    <div>
                        <label class="block text-sm font-medium text-dark-700 mb-2">Category</label>
                        <select name="category" id="filter-category" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-primary-500 outline-none">
                            <option value="">All Categories</option>
                        </select>
                    </div>

                    <!-- Breed -->
                    <div>
                        <label class="block text-sm font-medium text-dark-700 mb-2">Breed</label>
                        <select name="breed" id="filter-breed" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-primary-500 outline-none">
                            <option value="">All Breeds</option>
                        </select>
                    </div>

                    <!-- Price Range -->
                    <div>
                        <label class="block text-sm font-medium text-dark-700 mb-2">Price Range</label>
                        <div class="flex gap-2">
                            <input type="number" name="min_price" placeholder="Min" class="w-1/2 px-3 py-2 rounded-xl border border-gray-200 focus:border-primary-500 outline-none">
                            <input type="number" name="max_price" placeholder="Max" class="w-1/2 px-3 py-2 rounded-xl border border-gray-200 focus:border-primary-500 outline-none">
                        </div>
                    </div>

                    <!-- State -->
                    <div>
                        <label class="block text-sm font-medium text-dark-700 mb-2">State</label>
                        <select name="state" id="filter-state" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-primary-500 outline-none">
                            <option value="">All States</option>
                        </select>
                    </div>

                    <!-- City -->
                    <div>
                        <label class="block text-sm font-medium text-dark-700 mb-2">City</label>
                        <input type="text" name="city" id="filter-city" placeholder="Enter city..." class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-primary-500 outline-none">
                    </div>

                    <!-- Gender -->
                    <div>
                        <label class="block text-sm font-medium text-dark-700 mb-2">Gender</label>
                        <div class="flex gap-2">
                            <label class="flex items-center">
                                <input type="radio" name="gender" value="" checked class="mr-2"> All
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="gender" value="male" class="mr-2"> Male
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="gender" value="female" class="mr-2"> Female
                            </label>
                        </div>
                    </div>

                    <!-- Listing Type -->
                    <div>
                        <label class="block text-sm font-medium text-dark-700 mb-2">Listing Type</label>
                        <select name="listing_type" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-primary-500 outline-none">
                            <option value="">All</option>
                            <option value="sale">For Sale</option>
                            <option value="adoption">For Adoption</option>
                        </select>
                    </div>

                    <!-- Vaccinated -->
                    <div>
                        <label class="flex items-center">
                            <input type="checkbox" name="is_vaccinated" value="true" class="mr-2 rounded">
                            <span class="text-sm text-dark-700">Vaccinated Only</span>
                        </label>
                    </div>

                    <button type="submit" class="w-full bg-primary-500 hover:bg-primary-600 text-white py-3 rounded-xl font-semibold transition">
                        Apply Filters
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1">
            <!-- Sort & View Options -->
            <div class="bg-white rounded-xl shadow-soft p-4 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2">
                    <span class="text-gray-600">Sort by:</span>
                    <select id="sort-select" class="px-4 py-2 rounded-lg border border-gray-200 focus:border-primary-500 outline-none">
                        <option value="-created_at">Newest First</option>
                        <option value="price">Price: Low to High</option>
                        <option value="-price">Price: High to Low</option>
                        <option value="-views_count">Most Viewed</option>
                    </select>
                </div>
                <div id="results-count" class="text-gray-600">Loading...</div>
            </div>

            <!-- Pet Grid -->
            <div id="pets-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-16">
                    <div class="spinner mx-auto"></div>
                    <p class="text-gray-500 mt-4">Loading pets...</p>
                </div>
            </div>

            <!-- Pagination -->
            <div id="pagination" class="mt-8 flex justify-center"></div>
        </main>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let currentPage = 1;
const urlParams = new URLSearchParams(window.location.search);

document.addEventListener('DOMContentLoaded', function() {
    // Load categories and pre-select from URL
    fetch('/api/v1/pets/categories/')
        .then(res => res.json())
        .then(data => {
            const select = document.getElementById('filter-category');
            const categories = data.results || data;
            const selectedCategory = urlParams.get('category');
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.slug;
                option.textContent = cat.name;
                option.dataset.name = cat.name;
                if (selectedCategory === cat.slug) option.selected = true;
                select.appendChild(option);
            });
            // If a category was pre-selected, load its breeds and update title
            if (selectedCategory) {
                loadBreeds(selectedCategory);
                const selectedOpt = select.querySelector(`option[value="${selectedCategory}"]`);
                if (selectedOpt) {
                    document.getElementById('page-title').textContent = selectedOpt.textContent;
                }
            }
        });

    // Load states dropdown
    fetch('/api/v1/pets/states/')
        .then(res => res.json())
        .then(states => {
            const select = document.getElementById('filter-state');
            const selectedState = urlParams.get('state');
            states.forEach(state => {
                const option = document.createElement('option');
                option.value = state;
                option.textContent = state;
                if (selectedState === state) option.selected = true;
                select.appendChild(option);
            });
        })
        .catch(() => {});

    // Set initial filter values from URL
    document.querySelectorAll('#filter-form input, #filter-form select').forEach(input => {
        const value = urlParams.get(input.name);
        if (value) {
            if (input.type === 'checkbox') {
                input.checked = value === 'true';
            } else if (input.type === 'radio') {
                input.checked = input.value === value;
            } else if (input.id !== 'filter-category' && input.id !== 'filter-state') {
                // Category and state are set above when options are created
                input.value = value;
            }
        }
    });

    // Load breeds when category changes
    document.getElementById('filter-category').addEventListener('change', function() {
        loadBreeds(this.value);
        // Update page title
        const selectedOpt = this.options[this.selectedIndex];
        document.getElementById('page-title').textContent = this.value ? selectedOpt.textContent : 'All Pets';
    });

    // Handle filter form submission
    document.getElementById('filter-form').addEventListener('submit', function(e) {
        e.preventDefault();
        currentPage = 1;
        loadPets();
    });

    // Handle sort change
    document.getElementById('sort-select').addEventListener('change', function() {
        loadPets();
    });

    // Initial load
    loadPets();
});

function loadBreeds(categorySlug) {
    const breedSelect = document.getElementById('filter-breed');
    breedSelect.innerHTML = '<option value="">All Breeds</option>';
    
    if (!categorySlug) return;
    
    // Get the category name from the selected option
    const catSelect = document.getElementById('filter-category');
    const selectedOption = catSelect.options[catSelect.selectedIndex];
    const categoryName = selectedOption ? selectedOption.dataset.name || selectedOption.textContent : '';
    
    fetch('/api/v1/pets/breeds/')
        .then(res => res.json())
        .then(data => {
            const breeds = (data.results || data).filter(b => {
                // Match by category name (more reliable than slug matching)
                if (b.category_name) {
                    return b.category_name.toLowerCase() === categoryName.toLowerCase();
                }
                // Fallback: match by category id
                return false;
            });
            const selectedBreed = urlParams.get('breed');
            breeds.forEach(breed => {
                const option = document.createElement('option');
                option.value = breed.slug;
                option.textContent = breed.name;
                if (selectedBreed === breed.slug) option.selected = true;
                breedSelect.appendChild(option);
            });
        });
}

function loadPets() {
    const grid = document.getElementById('pets-grid');
    grid.innerHTML = '<div class="col-span-full text-center py-16"><div class="spinner mx-auto"></div></div>';

    // Build query params
    const params = new URLSearchParams();
    const form = document.getElementById('filter-form');
    const formData = new FormData(form);
    
    formData.forEach((value, key) => {
        if (value) params.append(key, value);
    });

    params.append('ordering', document.getElementById('sort-select').value);
    params.append('page', currentPage);

    // Update URL
    window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);

    fetch(`/api/v1/pets/?${params.toString()}`)
        .then(res => res.json())
        .then(data => {
            const pets = data.results || data;
            const count = data.count || pets.length;
            
            document.getElementById('results-count').textContent = `${count} pet${count !== 1 ? 's' : ''} found`;

            if (pets.length > 0) {
                grid.innerHTML = pets.map(pet => `
                    <div class="bg-white rounded-2xl overflow-hidden shadow-soft hover:shadow-lg transition-all duration-300 group">
                        <div class="relative aspect-[4/3] overflow-hidden">
                            <a href="/pets/${pet.slug}/">
                                <img src="${pet.primary_image_url}" 
                                     alt="${pet.name}"
                                     class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                     onerror="this.src='/static/images/placeholder/default_pet_image.png'">
                            </a>
                            ${pet.is_featured ? '<span class="absolute top-3 left-3 bg-primary-500 text-white text-xs px-2 py-1 rounded-lg">Featured</span>' : ''}
                            ${pet.listing_type === 'adoption' ? '<span class="absolute top-3 right-3 bg-success-500 text-white text-xs px-2 py-1 rounded-lg">Adoption</span>' : ''}
                            <button onclick="toggleWishlist(${pet.id})" class="absolute top-3 ${pet.listing_type === 'adoption' ? 'right-24' : 'right-3'} p-2 bg-white/90 hover:bg-white rounded-full shadow-md transition">
                                <i data-lucide="heart" class="w-5 h-5 text-gray-400 hover:text-red-500"></i>
                            </button>
                        </div>
                        <div class="p-4">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-xs text-primary-600 font-medium bg-primary-50 px-2 py-1 rounded">${pet.category_name}</span>
                                ${pet.breed_name ? `<span class="text-xs text-gray-500">${pet.breed_name}</span>` : ''}
                            </div>
                            <h3 class="font-semibold text-dark-800 text-lg mb-1 truncate">
                                <a href="/pets/${pet.slug}/" class="hover:text-primary-600 transition">${pet.name}</a>
                            </h3>
                            <div class="flex items-center text-sm text-gray-500 mb-3 space-x-3">
                                <span>${pet.age_display || 'Unknown'}</span>
                                <span class="capitalize">${pet.gender}</span>
                            </div>
                            <div class="flex flex-wrap gap-2 mb-3">
                                ${pet.is_vaccinated ? '<span class="text-xs text-success-600 bg-success-50 px-2 py-1 rounded">Vaccinated</span>' : ''}
                            </div>
                            <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                                ${pet.listing_type === 'sale' 
                                    ? `<span class="text-xl font-bold text-primary-600">₹${parseInt(pet.price).toLocaleString()}</span>` 
                                    : '<span class="text-lg font-semibold text-success-600">Free Adoption</span>'}
                                <span class="text-sm text-gray-500">${pet.seller_city || ''}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                lucide.createIcons();

                // Build pagination
                if (data.count && data.count > 10) {
                    const totalPages = Math.ceil(data.count / 10);
                    let paginationHtml = '<div class="flex gap-2">';
                    for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                        paginationHtml += `<button onclick="goToPage(${i})" class="px-4 py-2 rounded-lg ${i === currentPage ? 'bg-primary-500 text-white' : 'bg-white text-dark-700 hover:bg-primary-50'}">${i}</button>`;
                    }
                    paginationHtml += '</div>';
                    document.getElementById('pagination').innerHTML = paginationHtml;
                }
            } else {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <img src="/static/images/placeholder/No-Image-Placeholder.svg.png" alt="No pets" class="w-32 h-32 mx-auto mb-4 opacity-50">
                        <h3 class="text-xl font-semibold text-dark-800 mb-2">No pets found</h3>
                        <p class="text-gray-500">Try adjusting your filters</p>
                    </div>
                `;
            }
        })
        .catch(() => {
            grid.innerHTML = '<div class="col-span-full text-center py-16 text-red-500">Failed to load pets</div>';
        });
}

function goToPage(page) {
    currentPage = page;
    loadPets();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilters() {
    document.getElementById('filter-form').reset();
    window.history.replaceState({}, '', window.location.pathname);
    currentPage = 1;
    loadPets();
}
</script>
{% endblock %}
